version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: video_studio
      POSTGRES_PASSWORD: password
      POSTGRES_DB: video_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Job Queue & Cache)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API (Rust/Axum)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://video_studio:password@postgres/video_studio
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-change-in-production
      STORAGE_PATH: /app/storage
      BIND_ADDRESS: 0.0.0.0:3000
      WHISPER_SERVICE_URL: http://whisper:8001
    volumes:
      - storage_data:/app/storage
      - /tmp/video-studio:/tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Whisper Transcription Service (Python/FastAPI)
  whisper:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      MODEL_NAME: large-v3
      DEVICE: cpu
      COMPUTE_TYPE: int8
    volumes:
      - whisper_models:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  whisper_models:
